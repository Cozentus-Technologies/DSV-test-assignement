# Single-node Kafka in KRaft mode - no ZooKeeper.
# Enough for the test suite; not a production topology.
#
#   docker compose up -d      start
#   docker compose ps         status
#   docker compose down -v    stop and wipe the data volume
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: dsv-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single node, so nothing can be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # No rebalance delay: a test consumer joins and gets its partitions at once.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # CH-03: topics are created explicitly by the init container below.
      # Auto-creation gives one partition and hides configuration errors.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  # CH-03: explicit topic creation at three partitions. Keying by bookingId is
  # what preserves per-booking ordering; with one partition that is trivially
  # true and the ordering test would prove nothing (CH-11).
  # CH-03: explicit topic creation at three partitions. Keying by bookingId is
  # what preserves per-booking ordering; with one partition that is trivially
  # true and the ordering test would prove nothing (CH-11).
  topic-init:
    image: apache/kafka:3.9.0
    container_name: dsv-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        for t in booking.raw booking.enriched booking.flagged; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1;
        done;
        echo '--- topics ---';
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --describe

volumes:
  kafka-data:
