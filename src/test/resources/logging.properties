# Several tests deliberately drive the caught-and-logged paths: a throwing
# subscriber (SPEC 7) and unparseable payloads (SPEC 4). Production logging is
# unchanged; this only keeps `mvn -q verify` silent on a green build, so that
# any output at all is a real signal.
handlers = java.util.logging.ConsoleHandler
.level = INFO
com.cozentus.enrichment.level = SEVERE
